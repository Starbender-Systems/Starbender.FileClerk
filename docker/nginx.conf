worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $server_port $demo_public_port {
        8080 __LANDING_PORT__;
        8081 __BLAZOR_WEBAPP_PORT__;
        8082 __BLAZOR_SERVER_PORT__;
        8083 __BLAZOR_WASM_PORT__;
        8084 __ANGULAR_PORT__;
    }

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client-body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    server {
        listen 8080;
        server_name _;
        root /app/landing;
        index index.html;

        if ($host != "__DEMO_PUBLIC_HOST__") {
            return 308 http://__DEMO_PUBLIC_HOST__:$demo_public_port$request_uri;
        }

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8081;
        server_name _;

        if ($host != "__DEMO_PUBLIC_HOST__") {
            return 308 http://__DEMO_PUBLIC_HOST__:$demo_public_port$request_uri;
        }

        location / {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 8082;
        server_name _;

        if ($host != "__DEMO_PUBLIC_HOST__") {
            return 308 http://__DEMO_PUBLIC_HOST__:$demo_public_port$request_uri;
        }

        location / {
            proxy_pass http://127.0.0.1:5002;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 8083;
        server_name _;

        if ($host != "__DEMO_PUBLIC_HOST__") {
            return 308 http://__DEMO_PUBLIC_HOST__:$demo_public_port$request_uri;
        }

        location ^~ /images/clients/ {
            proxy_pass http://127.0.0.1:5103;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* ^/(api|connect|Account|Abp|swagger|health-status|health-ui|health-api|libs|themes|global-resources|__bundles)(/|$) {
            proxy_pass http://127.0.0.1:5103;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /.well-known/ {
            proxy_pass http://127.0.0.1:5103;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:5003;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8084;
        server_name _;
        root /app/angular;
        index index.html;

        if ($host != "__DEMO_PUBLIC_HOST__") {
            return 308 http://__DEMO_PUBLIC_HOST__:$demo_public_port$request_uri;
        }

        location = /getEnvConfig {
            default_type application/json;
            alias /app/angular/dynamic-env.json;
        }

        location ~* ^/(api|connect|Account|Abp|swagger|health-status|health-ui|health-api|libs|themes|images|global-resources|__bundles)(/|$) {
            proxy_pass http://127.0.0.1:5104;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /.well-known/ {
            proxy_pass http://127.0.0.1:5104;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
