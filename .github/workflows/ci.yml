name: CI

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Starbender.FileClerk.slnx

      - name: Build
        run: dotnet build src/Starbender.FileClerk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Starbender.FileClerk.slnx --configuration Release --no-build

  angular:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/angular
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  container:
    name: Container stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          POSTGRES_DB=fileclerk_override \
          POSTGRES_USER=fileclerk_override \
          POSTGRES_PASSWORD=fileclerk_override_only \
          POSTGRES_PORT=55432 \
          LANDING_PORT=18080 \
          docker compose config --format json |
            jq --exit-status '
              .services.postgres.ports[0].published == "55432" and
              .services.app.ports[0].published == "18080" and
              .services.postgres.environment.POSTGRES_DB == "fileclerk_override" and
              .services.postgres.environment.POSTGRES_USER == "fileclerk_override" and
              .services.postgres.environment.POSTGRES_PASSWORD == "fileclerk_override_only" and
              (.services.app.environment.ConnectionStrings__FileClerk |
                contains("Database=fileclerk_override;Username=fileclerk_override;Password=fileclerk_override_only"))
            '

      - name: Build application image
        run: docker compose build app

      - name: Start container stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify services
        run: |
          test "$(
            docker compose exec --no-TTY postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT 1"'
          )" = "1"
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet "FileClerk demos"
          docker compose exec --no-TTY app sh -ec '
            test "$(id -u)" -ne 0
            test -f /opt/fileclerk/build-info/dotnet-build-complete
            test -f /opt/fileclerk/build-info/angular-build-complete
            test ! -e /workspace
            test ! -e /app/node_modules
            test ! -e /root/.nuget
          '

      - name: Verify database persistence
        run: |
          docker compose exec --no-TTY postgres sh -ec '
            psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 \
              --command "CREATE TABLE container_smoke_test (id integer PRIMARY KEY)" \
              --command "INSERT INTO container_smoke_test VALUES (1)"
          '
          docker compose restart postgres
          docker compose up --detach --wait --wait-timeout 120
          test "$(
            docker compose exec --no-TTY postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT id FROM container_smoke_test"'
          )" = "1"

      - name: Clean up container stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime

  nuget:
    name: NuGet packages
    needs:
      - dotnet
      - angular
      - container
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Calculate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(dotnet gitversion /showvariable MajorMinorPatch)"
          package_version="${base_version}-ci-${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must match vMajor.Minor.Fix without leading zeroes." >&2
              exit 1
            fi

            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$base_version" ]]; then
              echo "Tag version $tag_version does not match GitVersion base $base_version." >&2
              exit 1
            fi

            if ! git show-ref --verify --quiet refs/remotes/origin/main; then
              echo "Full-history checkout did not provide origin/main." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "Release tag commit must be reachable from main." >&2
              exit 1
            fi

            package_version="$tag_version"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "development" ]]; then
            package_version="${base_version}-prerelease-${GITHUB_RUN_NUMBER}"
          fi

          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=nuget-packages-$package_version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $package_version"

      - name: Restore solution
        run: dotnet restore src/Starbender.FileClerk.slnx

      - name: Build versioned solution
        run: >-
          dotnet build src/Starbender.FileClerk.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      - name: Pack module projects
        run: >-
          dotnet pack src/Starbender.FileClerk.slnx
          --configuration Release
          --no-build
          --no-restore
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          -p:PackageOutputPath=${{ github.workspace }}/artifacts/nuget

      - name: Validate package contents
        run: >-
          ./scripts/validate-nuget-packages.sh
          artifacts/nuget
          ${{ steps.version.outputs.package-version }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

  nuget-publish:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - nuget
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
    steps:
      - name: Checkout validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download validated packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.nuget.outputs.artifact-name }}
          path: artifacts/nuget

      - name: Revalidate release packages
        run: >-
          ./scripts/validate-nuget-packages.sh
          artifacts/nuget
          ${{ needs.nuget.outputs.package-version }}

      - name: Publish stable packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "This repository must have access to the NUGET_API_KEY Actions secret." >&2
            exit 1
          fi

          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
