name: CI

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/Starbender.FileClerk.slnx
          dotnet restore src/demo/Starbender.FileClerk.Demo.slnx

      - name: Build
        run: |
          dotnet build src/Starbender.FileClerk.slnx --configuration Release --no-restore
          dotnet build src/demo/Starbender.FileClerk.Demo.slnx --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test src/Starbender.FileClerk.slnx --configuration Release --no-build
          dotnet test src/demo/Starbender.FileClerk.Demo.slnx --configuration Release --no-build

  angular:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/angular/package-lock.json
            src/demo/angular/package-lock.json

      - name: Install library dependencies
        working-directory: src/angular
        run: npm ci

      - name: Lint and build library
        working-directory: src/angular
        run: npm run lint && npm run build

      - name: Install demo dependencies
        working-directory: src/demo/angular
        run: npm ci

      - name: Lint and build demo
        working-directory: src/demo/angular
        run: npm run lint && npm run build:prod

  container:
    name: Container stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          POSTGRES_DB=fileclerk_override \
          POSTGRES_USER=fileclerk_override \
          POSTGRES_PASSWORD=fileclerk_override_only \
          POSTGRES_PORT=55432 \
          LANDING_PORT=18080 \
          BLAZOR_WEBAPP_PORT=18081 \
          BLAZOR_SERVER_PORT=18082 \
          BLAZOR_WASM_PORT=18083 \
          ANGULAR_PORT=18084 \
          MVC_PORT=18085 \
          DEMO_PUBLIC_HOST=fileclerk.example.test \
          docker compose config --format json |
            jq --exit-status '
              .services.postgres.ports[0].published == "55432" and
              ([.services.app.ports[].published] | sort == ["18080", "18081", "18082", "18083", "18084", "18085"]) and
              .services.postgres.environment.POSTGRES_DB == "fileclerk_override" and
              .services.postgres.environment.POSTGRES_USER == "fileclerk_override" and
              .services.postgres.environment.POSTGRES_PASSWORD == "fileclerk_override_only" and
              .services.app.environment.DEMO_PUBLIC_HOST == "fileclerk.example.test" and
              .services.app.environment.LANDING_PORT == "18080" and
              .services.app.environment.BLAZOR_WEBAPP_PORT == "18081" and
              .services.app.environment.BLAZOR_SERVER_PORT == "18082" and
              .services.app.environment.BLAZOR_WASM_PORT == "18083" and
              .services.app.environment.ANGULAR_PORT == "18084" and
              .services.app.environment.MVC_PORT == "18085" and
              .services.app.volumes[0].target == "/home/app/.aspnet/DataProtection-Keys" and
              .volumes.data_protection_keys != null and
              (.services.app.environment.ConnectionStrings__FileClerk |
                contains("Database=fileclerk_override;Username=fileclerk_override;Password=fileclerk_override_only"))
            '

      - name: Build application image
        run: docker compose build app

      - name: Start container stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify services
        run: |
          verify_theme_bundle() {
            base_url="$1"
            bundle_path="$(
              curl --fail --silent --show-error "$base_url/" |
                grep --only-matching '/__bundles/[^"]*\.css' |
                head --lines=1
            )"
            test -n "$bundle_path"
            curl --fail --silent --show-error "$base_url$bundle_path" >/dev/null
          }

          verify_account_page_assets() {
            base_url="$1"
            login_html="$(curl --fail --silent --show-error "$base_url/Account/Login")"

            while IFS= read -r asset_path; do
              case "$asset_path" in
                //*) continue ;;
                *.css*) expected_type="text/css" ;;
                *.js*) expected_type="javascript" ;;
                *.svg*) expected_type="image/svg+xml" ;;
                *) continue ;;
              esac

              actual_type="$(
                curl --fail --location --silent --show-error \
                  --output /dev/null --write-out '%{content_type}' \
                  "$base_url$asset_path"
              )"
              case "$actual_type" in
                *"$expected_type"*) ;;
                *)
                  echo "Unexpected content type for $base_url$asset_path: $actual_type" >&2
                  return 1
                  ;;
              esac
            done < <(
              printf '%s' "$login_html" |
                grep --only-matching --extended-regexp '(href|src)="[^"]+"' |
                cut --delimiter='"' --fields=2 |
                grep '^/'
            )
          }

          test "$(
            docker compose exec --no-TTY postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT 1"'
          )" = "1"
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8080/health
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8080/ | grep --quiet "FileClerk demos"
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8080/ | grep --quiet 'data-demo="mvc"'
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8081/ >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8082/health-status >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8083/ >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8083/health-status >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --location --silent --show-error http://localhost:8083/images/getting-started/img-blog.png >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --location --silent --show-error http://localhost:8083/images/clients/blazor.svg >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8084/ >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8084/health-status >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8085/ >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8085/health-status >/dev/null
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8085/FileClerk | grep --quiet "FileClerk"
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8083/api/file-clerk/example | jq --exit-status '.value == 42'
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8084/api/file-clerk/example | jq --exit-status '.value == 42'
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8085/api/file-clerk/example | jq --exit-status '.value == 42'
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8085/.well-known/openid-configuration | jq --exit-status '.issuer == "http://localhost:8085/"'
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://localhost:8084/getEnvConfig | jq --exit-status '.application.baseUrl == "http://localhost:8084"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' http://127.0.0.1:8083/)" = "308 http://localhost:8083/"
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' http://127.0.0.1:8085/)" = "308 http://localhost:8085/"
          verify_theme_bundle http://localhost:8081
          verify_theme_bundle http://localhost:8082
          verify_account_page_assets http://localhost:8083
          verify_account_page_assets http://localhost:8084
          verify_theme_bundle http://localhost:8085
          verify_account_page_assets http://localhost:8085
          docker compose logs app | grep --quiet "Migrations and seed data completed; starting demo hosts."
          test "$(
            docker compose exec --no-TTY postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT COUNT(*) FROM \"__EFMigrationsHistory\""'
          )" -ge 1
          test "$(
            docker compose exec --no-TTY postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT COUNT(*) FROM \"AbpUsers\" WHERE \"UserName\" = '\''admin'\''"'
          )" = "1"
          docker compose exec --no-TTY app sh -ec '
            test "$(id -u)" -ne 0
            test ! -e /workspace
            test ! -e /app/node_modules
            test ! -e /root/.nuget
            test ! -d /usr/share/dotnet/sdk
            test -z "$(find /app -type f \( -name "*.cs" -o -name "*.csproj" -o -name "package-lock.json" \) -print -quit)"
          '

      - name: Verify MVC session survives application recreation
        run: |
          cookie_jar="$(mktemp)"
          email_settings_response="$(mktemp)"
          global_script_response="$(mktemp)"
          antiforgery_headers="$(mktemp)"
          trap 'rm --force "$cookie_jar" "$email_settings_response" "$global_script_response" "$antiforgery_headers"' EXIT

          login_html="$(
            curl --fail --silent --show-error \
              --cookie-jar "$cookie_jar" \
              http://localhost:8085/Account/Login
          )"
          login_token="$(
            printf '%s' "$login_html" |
              grep --only-matching 'name="__RequestVerificationToken" type="hidden" value="[^"]*"' |
              head --lines=1 |
              cut --delimiter='"' --fields=6
          )"
          test -n "$login_token"

          test "$(
            curl --silent --show-error \
              --cookie "$cookie_jar" \
              --cookie-jar "$cookie_jar" \
              --data-urlencode "LoginInput.UserNameOrEmailAddress=admin" \
              --data-urlencode "LoginInput.Password=1q2w3E*" \
              --data-urlencode "LoginInput.RememberMe=false" \
              --data-urlencode "__RequestVerificationToken=$login_token" \
              --output /dev/null \
              --write-out '%{http_code}' \
              http://localhost:8085/Account/Login
          )" = "302"

          settings_html="$(
            curl --fail --silent --show-error \
              --cookie "$cookie_jar" \
              http://localhost:8085/SettingManagement
          )"
          global_script_path="$(
            printf '%s' "$settings_html" |
              grep --only-matching '/__bundles/Basic\.Global\.[^"]*\.js[^" ]*' |
              head --lines=1
          )"
          test -n "$global_script_path"
          curl --fail --silent --show-error \
            --output "$global_script_response" \
            "http://localhost:8085$global_script_path"
          grep --quiet 'XSRF-TOKEN-MVC-v1' "$global_script_response"

          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            --cookie "XSRF-TOKEN=stale-token-from-another-demo" \
            --cookie-jar "$cookie_jar" \
            --dump-header "$antiforgery_headers" \
            --output /dev/null \
            http://localhost:8085/Abp/ApplicationConfigurationScript
          grep --ignore-case --quiet \
            '^set-cookie: XSRF-TOKEN-MVC-v1=.*samesite=lax' \
            "$antiforgery_headers"
          request_token="$(
            awk '$6 == "XSRF-TOKEN-MVC-v1" { print $7 }' "$cookie_jar" |
              tail --lines=1
          )"
          test -n "$request_token"

          docker compose up --detach --force-recreate --no-deps app
          curl --retry 60 --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error \
            http://localhost:8085/health-status >/dev/null

          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            --cookie "XSRF-TOKEN=stale-token-from-another-demo" \
            --header "RequestVerificationToken: $request_token" \
            --data-urlencode "id=Volo.Abp.EmailSetting" \
            --output "$email_settings_response" \
            http://localhost:8085/SettingManagement?handler=RenderView
          grep --quiet 'EmailSettingsForm' "$email_settings_response"

      - name: Verify database persistence
        run: |
          docker compose exec --no-TTY postgres sh -ec '
            psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 \
              --command "CREATE TABLE container_smoke_test (id integer PRIMARY KEY)" \
              --command "INSERT INTO container_smoke_test VALUES (1)"
          '
          docker compose restart postgres
          docker compose up --detach --wait --wait-timeout 120
          test "$(
            docker compose exec --no-TTY postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT id FROM container_smoke_test"'
          )" = "1"

      - name: Clean up container stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime

  nuget:
    name: NuGet packages
    needs:
      - dotnet
      - angular
      - container
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Calculate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(dotnet gitversion /showvariable MajorMinorPatch)"
          package_version="${base_version}-ci-${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must match vMajor.Minor.Fix without leading zeroes." >&2
              exit 1
            fi

            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$base_version" ]]; then
              echo "Tag version $tag_version does not match GitVersion base $base_version." >&2
              exit 1
            fi

            if ! git show-ref --verify --quiet refs/remotes/origin/main; then
              echo "Full-history checkout did not provide origin/main." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "Release tag commit must be reachable from main." >&2
              exit 1
            fi

            package_version="$tag_version"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "development" ]]; then
            package_version="${base_version}-prerelease-${GITHUB_RUN_NUMBER}"
          fi

          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=nuget-packages-$package_version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $package_version"

      - name: Restore solution
        run: dotnet restore src/Starbender.FileClerk.slnx

      - name: Build versioned solution
        run: >-
          dotnet build src/Starbender.FileClerk.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      - name: Pack module projects
        run: >-
          dotnet pack src/Starbender.FileClerk.slnx
          --configuration Release
          --no-build
          --no-restore
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          -p:PackageOutputPath=${{ github.workspace }}/artifacts/nuget

      - name: Validate package contents
        run: >-
          ./scripts/validate-nuget-packages.sh
          artifacts/nuget
          ${{ steps.version.outputs.package-version }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

  nuget-publish:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - nuget
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
    steps:
      - name: Checkout validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download validated packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.nuget.outputs.artifact-name }}
          path: artifacts/nuget

      - name: Revalidate release packages
        run: >-
          ./scripts/validate-nuget-packages.sh
          artifacts/nuget
          ${{ needs.nuget.outputs.package-version }}

      - name: Publish stable packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "This repository must have access to the NUGET_API_KEY Actions secret." >&2
            exit 1
          fi

          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
